name: pre-commit

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every step is gated on the root file it needs, so the whole job is a no-op —
  # not a hard failure — in a consumer that has none of them. template-sync
  # delivers this workflow but delivers no .pre-commit-config.yaml, package.json
  # or .nvmrc, so a repo that never had them would otherwise go red on every PR
  # from its first sync onwards. An absent .pre-commit-config.yaml means there
  # are no hooks to run, which is not-applicable rather than unverifiable.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # setup-python provides the `python3.11` on PATH that pre-commit binds
      # every `language: python` hook to (default_language_version). uvx runs
      # pre-commit itself; the two versions are kept in sync by
      # tests/test_version_sync.py.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: hashFiles('.pre-commit-config.yaml') != ''
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        if: hashFiles('.pre-commit-config.yaml') != ''
      # check-proto-pollution does `import ts from "typescript"`, resolved from
      # node_modules (ESM ignores NODE_PATH) — absent until `pnpm install` runs.
      # The composite no-ops its Node half when package.json is absent.
      # node-version-file errors if the file is missing, so .nvmrc is passed
      # only when it exists.
      - name: Setup base environment
        if: hashFiles('.pre-commit-config.yaml') != ''
        uses: ./.github/actions/setup-base-env
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
      - name: Restore pre-commit cache
        if: hashFiles('.pre-commit-config.yaml') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-
      # Skip when the repo has no pre-commit config: `pre-commit` dies with
      # `InvalidConfigError: .pre-commit-config.yaml is not a file` otherwise,
      # which reads as a real failure when it just means no hooks are wired up.
      - name: Run pre-commit
        if: hashFiles('.pre-commit-config.yaml') != ''
        run: uvx pre-commit==4.6.0 run --all-files --show-diff-on-failure

  # Stable Required check: runs even when `pre-commit` is cancelled/skipped, so
  # a protected branch never gets stuck on a check that never reports.
  pre-commit-passed: # required-check: true
    if: always()
    needs: [pre-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/actions/report-job-result
          persist-credentials: false

      - name: Report result
        uses: ./.github/actions/report-job-result
        with:
          run: "true"
          decide-result: "success"
          result: ${{ needs.pre-commit.result }}
