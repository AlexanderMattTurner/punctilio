name: Refresh mutation weights

# mutation.yml balances its shards from config/mutation-weights.json — a map of
# measured test executions per source file. That map drifts as source and tests
# change, so weekly this job remeasures it and opens a PR with the result if it
# changed (main's required status checks reject a direct push). An
# untimed newcomer is over-weighted at the known p90 by the planner until the
# next refresh folds it in, so a stale week only means slightly looser shard
# balance, never a broken run.
#
# The remeasurement runs the SAME sharded plan as mutation.yml but with the
# incremental cache disabled, so every mutant is re-tested and its testsCompleted
# is fresh; each shard emits its slice of the map and the merge job sums them.

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-mutation-weights
  cancel-in-progress: false

jobs:
  prep:
    name: Plan mutation shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: plan
        env:
          SHARD_BUDGET: "25000"
          MAX_SHARDS: "16"
        run: echo "shards=$(node scripts/mutation-shards.mjs)" >> "$GITHUB_OUTPUT"

  measure:
    name: Measure shard ${{ matrix.index }}
    needs: prep
    runs-on: ubuntu-latest
    # Cache-disabled, so every shard runs fully cold (~15-20 min balanced); the
    # headroom backstops the dense files (quote-classifier is ~270 mutants per
    # ~190 lines, each running a large covering-test set).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: 22

      # No incremental cache restore, and a per-shard incremental file that never
      # exists, so Stryker re-tests every mutant and its testsCompleted is fresh.
      # The shard config disables the score break, so a non-zero exit is a crash.
      - name: Measure shard (full, no cache)
        env:
          MUTATE: ${{ matrix.mutate }}
          SHARD_INDEX: ${{ matrix.index }}
        run: pnpm run mutation stryker.shard.config.mjs --mutate "$MUTATE" --reporters json --incrementalFile "reports/fresh-$SHARD_INDEX.json"

      - name: Extract this shard's weights
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          test -f reports/mutation/mutation.json || {
            echo "::error::shard $SHARD_INDEX produced no report — the run crashed"
            exit 1
          }
          node scripts/mutation-weights.mjs report --out "weights-$SHARD_INDEX.json"

      - name: Upload shard weights
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-weights-${{ matrix.index }}
          path: weights-${{ matrix.index }}.json
          if-no-files-found: error

  merge:
    name: Merge weights and open a PR
    needs: [prep, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the refresh-mutation-weights branch
      pull-requests: write # open the PR when falling back to GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download shard weights
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: mutation-weights-*
          path: shard-weights
          merge-multiple: true

      - name: Merge into the committed map
        run: node scripts/mutation-weights.mjs merge shard-weights/*.json --out config/mutation-weights.json

      # main is protected by required status checks, so the refreshed map lands
      # through a PR rather than a direct push. A PR authored under GITHUB_TOKEN
      # doesn't trigger other on:pull_request workflows (GitHub's recursion
      # guard), so its required checks would never report; TEMPLATE_SYNC_TOKEN_ORG
      # gets it real CI. No-op when the map is unchanged.
      - name: Open a PR if the map changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # token-fallback-ok: GITHUB_TOKEN still opens the PR when the org PAT
          # isn't configured, just without triggering its checks until a push.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.GITHUB_TOKEN }}
          add-paths: config/mutation-weights.json
          commit-message: "chore(ci): refresh mutation weights map"
          title: "chore(ci): refresh mutation weights map"
          body: |
            Weekly remeasurement of `config/mutation-weights.json` from a
            cache-disabled sharded mutation run. The map only balances
            mutation.yml's shards; it never changes what is tested.
          branch: refresh-mutation-weights
          delete-branch: true
