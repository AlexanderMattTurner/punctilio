name: Sync from Template

# Syncs updates from the template repository automatically.
# Runs daily or manually via "Run workflow" button.
# No setup required - works out of the box.
#
# Features:
# - Skips entirely in the template repository itself, and fails loud when
#   TEMPLATE_SYNC_ORG points the sync at a fork of the running repo
# - 3-way merges local customizations with template updates automatically
# - Falls back to template version + Claude resolution when no merge base exists
# - Detects new files, changed files, and deleted files from the template
# - Tracks which template version the repo is synced to (.template-version)
# - Requests @claude to resolve any remaining conflicts and finalize the merge
#
# =============================================================================
# HANDLING CUSTOMIZATIONS DURING SYNC
# =============================================================================
# Projects may have local customizations in synced files (e.g., project-specific
# tools in session-setup.sh, custom pre-commit checks). When resolving conflicts:
#
# 1. Look for header comments like "IMPORTANT: This file has project-specific
#    customizations" or "Future Claudes: Leave these customizations as-is"
# 2. Preserve local customizations while adopting new template features
# 3. When in doubt, keep local changes - they exist for a reason
# 4. Check for duplicate CI: if the target repo already has test/lint/format
#    workflows, delete the template's versions. A file the sync delivered
#    before and the adopter deleted is reported as declined, not restored, so
#    the deletion holds on its own and needs no EXCLUDE_PATHS entry.
# 5. A workflow that must never be introduced into a repo that has its own
#    equivalent (the release flow) belongs in OPT_IN_PATHS.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      dry-run:
        # A `type: boolean` input arrives as a real boolean, so both this default
        # and every condition that reads it below must be boolean too. Comparing
        # it to the STRING 'true' silently never matches: GitHub casts across
        # types to a number, and `true == 'true'` compares 1 with NaN. That made
        # every "dry run" dispatch open a real pull request.
        description: "Show what would be synced without making changes"
        required: false
        default: false
        type: boolean
  schedule:
    # Run daily at 9am UTC
    - cron: "0 9 * * *"

env:
  TEMPLATE_REPO: "${{ vars.TEMPLATE_SYNC_ORG || 'AlexanderMattTurner' }}/claude-automation-template"
  # Whole directories of core automation files that are always template-owned.
  # Every file under these paths propagates to downstream consumers; new files
  # added to the template auto-sync without anyone having to edit this list.
  # Downstream-added files in these directories are left alone (sync only
  # copies files that exist in the template).
  #
  # An entry may also be a single FILE, which is how a synced file's DATA
  # dependency travels when it lives outside every synced directory. A synced
  # script that reads such a file arrives downstream without it and dies on the
  # read, so each one a synced file names by a fixed path is listed here:
  #   .github/tool-versions.sh                 <- .github/scripts/install-mergiraf.sh
  #   .github/claude-cli-version               <- .github/scripts/install-claude-cli.sh
  #   config/javascript/commitlint.config.js   <- .hooks/commit-msg
  # A consumer that maintains its own richer copy of one of these (extra tools
  # pinned for its own CI) keeps it by adding that path to EXCLUDE_PATHS.
  SYNC_PATHS: ".claude .hooks .github/actions .github/scripts .github/workflows .github/prompts .github/tool-versions.sh .github/claude-cli-version config/javascript/commitlint.config.js"
  # Paths to exclude from syncing. An entry names one file or one directory, and
  # a directory entry covers every file under it.
  #
  # NOTE: An adopter that already has its own test/lint/format CI workflows can
  # simply delete the template's equivalents; the sync declines to re-add a file
  # it delivered before. Use this list for a file the sync has NEVER delivered,
  # or to freeze one the adopter keeps but maintains itself.
  # Common candidates: .github/workflows/node-tests.yaml,
  # .github/workflows/lint.yaml, .github/workflows/format-check.yaml
  #
  # The security-vulnerability-scan workflow + prompt are intentionally NOT
  # propagated to downstream repos; each consumer owns its own security-scan
  # cadence and model pin, so the template stops overwriting them on sync.
  EXCLUDE_PATHS: ".github/workflows/security-vulnerability-scan.yaml .github/prompts/security-vulnerability-scan.md"
  # Files the sync UPDATES but never INTRODUCES. Absent from the child repo they
  # are skipped; present, they sync like anything else. This is the opt-in half
  # of EXCLUDE_PATHS: opting in is creating the file once, opting out is deleting
  # it (and it stays deleted — no EXCLUDE_PATHS entry needed).
  #
  # auto-version.yaml is the release flow's entry point: it runs on EVERY push to
  # the default branch and, for a non-private package, decides a
  # Conventional-Commits semver bump and runs `pnpm publish` (OIDC provenance —
  # no NPM_TOKEN). Introducing it into a repo that already publishes gives that
  # repo TWO publishers; because the concurrency groups differ they never
  # serialize, so both compute the same version and one loses the race with an
  # unrecognizable `npm error code E404 ... PUT` on an already-published version.
  # Opt in by copying it from the template:
  #   curl -fsSL https://raw.githubusercontent.com/AlexanderMattTurner/claude-automation-template/main/.github/workflows/auto-version.yaml \
  #     -o .github/workflows/auto-version.yaml
  # CHANGELOG.md lives outside SYNC_PATHS and never syncs, so a versioned
  # consumer must also create it to bootstrap the flow.
  #
  # A consumer that KEEPS its own release workflow instead should give it the
  # template's workflow name — "Auto version bump and publish" — or add its own
  # name to the `workflows:` lists in ci-failure-notify.yaml and
  # build-publish-notify.yaml, which bind by name, not filename. Otherwise its
  # release failures notify nobody.
  OPT_IN_PATHS: ".github/workflows/auto-version.yaml"

concurrency:
  group: template-sync
  cancel-in-progress: false

permissions: {}

jobs:
  # A repo cannot be its own upstream. This runs as a separate job because a
  # job-level `if:` cannot read workflow `env`, and the alternative — repeating
  # the guard on every step below — is a condition that a newly added step
  # silently opts out of.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      self_sync: ${{ steps.check.outputs.self_sync }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Refuse to sync this repository from itself
        id: check
        env:
          # token-fallback-ok: designed graceful degradation, not an accident.
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || github.token }}
        run: bash .github/scripts/template-sync-preflight.sh

  sync:
    needs: preflight
    if: needs.preflight.outputs.self_sync != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout child repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Checkout template repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          path: _template
          # TEMPLATE_SYNC_TOKEN_ORG is optional — GITHUB_TOKEN has no cross-repo
          # reach, so this checkout only works without the PAT when TEMPLATE_REPO
          # is public (the default). A private template repo needs the org PAT.
          # token-fallback-ok: designed graceful degradation, not an accident.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check token workflow scope
        env:
          # Mirrors the checkout step above — validates whichever token is
          # actually in play (PAT or the default token) for the 'workflow'
          # scope this sync needs to push .github/workflows/ changes.
          # token-fallback-ok: designed graceful degradation, not an accident.
          TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.GITHUB_TOKEN }}
        # Run the child repo's own copy — never execute scripts directly from
        # the template checkout. Template script updates arrive via sync PRs
        # and go through human review before they can execute.
        run: bash .github/scripts/check-token-scope.sh

      - name: Sync template files with conflict detection
        id: sync
        env:
          SYNC_PATHS: ${{ env.SYNC_PATHS }}
          EXCLUDE_PATHS: ${{ env.EXCLUDE_PATHS }}
          OPT_IN_PATHS: ${{ env.OPT_IN_PATHS }}
        run: bash .github/scripts/template-sync.sh

      - name: Show diff (dry run)
        if: inputs.dry-run == true && steps.sync.outputs.has_changes == 'true'
        env:
          HAS_CONFLICTS: ${{ steps.sync.outputs.has_conflicts }}
          HAS_DELETIONS: ${{ steps.sync.outputs.has_deletions }}
          CONFLICT_FILES: ${{ steps.sync.outputs.conflict_files }}
          DELETED_FILES: ${{ steps.sync.outputs.deleted_files }}
        run: bash .github/scripts/show-sync-diff.sh

      - name: Create Pull Request
        if: inputs.dry-run != true && (steps.sync.outputs.has_changes == 'true' || steps.sync.outputs.has_conflicts == 'true' || steps.sync.outputs.has_deletions == 'true')
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # A PR authored under GITHUB_TOKEN doesn't trigger other
          # on:pull_request workflows (GitHub's recursion guard), so this sync PR
          # needs TEMPLATE_SYNC_TOKEN_ORG to get real CI; falling back to
          # GITHUB_TOKEN still opens the PR when the org PAT isn't configured,
          # just without triggering downstream checks until a human comments/pushes.
          # token-fallback-ok: designed graceful degradation, not an accident.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync from template repository (${{ steps.sync.outputs.template_sha_short }})"
          title: "chore: sync from template repository"
          body: |
            This PR syncs updates from the template repository.

            **Template version:** `${{ steps.sync.outputs.template_sha_short }}`
            **Updated paths:** ${{ steps.sync.outputs.changed_paths }}
            **Template repository:** ${{ env.TEMPLATE_REPO }}

            ${{ steps.sync.outputs.changelog && format('### Changelog since last sync

            ```
            {0}
            ```

            ', steps.sync.outputs.changelog) }}${{ steps.sync.outputs.has_downgrades == 'true' && format('---

            ## ⚠️ Adopter-ahead — review these auto-merges for lost customizations

            A "clean" 3-way auto-merge dropped lines that existed in this repo''s local copy. The sync uses a single repo-wide merge base (`.template-version`), which can be stale for a file first synced at a different template revision — when it is, git reports no conflict while silently shrinking your changes. **Review each file below** and restore anything of yours the merge removed:

            {0}

            ', steps.sync.outputs.downgrade_report) || '' }}${{ steps.sync.outputs.auto_merged_files && format('### Auto-merged files

            The following files were merged automatically (3-way merge, no conflicts):

            `{0}`

            ', steps.sync.outputs.auto_merged_files) || '' }}${{ steps.sync.outputs.declined_files && format('### Declined files (deleted here, not re-added)

            The template still ships these, and this repo deleted them after an earlier sync. The sync left them out. To adopt one, copy it from the template by hand.

            `{0}`

            ', steps.sync.outputs.declined_files) || '' }}${{ steps.sync.outputs.inert_entries && format('### Inert EXCLUDE_PATHS / OPT_IN_PATHS entries

            These entries name nothing in the template, so they cover nothing. Correct the spelling, or delete the entry.

            `{0}`

            ', steps.sync.outputs.inert_entries) || '' }}${{ steps.sync.outputs.has_deletions == 'true' && format('---

            ## Files Removed from Template

            The following files were **deleted in the template** but still exist locally. Consider removing them if they are no longer needed:

            `{0}`

            ', steps.sync.outputs.deleted_files) || '' }}${{ steps.sync.outputs.has_conflicts == 'true' && '---

            ## Conflicts for Claude to Resolve

            The following files need conflict resolution. Claude will resolve these automatically.

            ' || '' }}${{ steps.sync.outputs.conflict_report }}

            ---
            Please review the changes and merge if appropriate.
          branch: template-sync
          delete-branch: true
          labels: ${{ steps.sync.outputs.has_conflicts == 'true' && 'template-sync,merge-conflict' || 'template-sync' }}

      # Resolve IN THIS RUN rather than posting an @claude comment and hoping a
      # separate workflow gets to it. The PR then arrives readable instead of
      # carrying raw markers, and the tier report below is what lets a clean
      # sync merge itself.
      #
      # After create-pull-request the workspace is back on the base ref and the
      # markers live on the sync branch, so switch to it before resolving.
      - name: Install mergiraf (pinned, digest-verified)
        if: inputs.dry-run != true && steps.sync.outputs.has_conflicts == 'true' && steps.create-pr.outputs.pull-request-number
        run: bash .github/scripts/install-mergiraf.sh

      - name: Resolve the sync conflicts
        id: resolve
        if: inputs.dry-run != true && steps.sync.outputs.has_conflicts == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          CONFLICT_FILES: ${{ steps.sync.outputs.conflict_files }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          # token-fallback-ok: the dedicated CI token is preferred so a sync does not
          # spend the operator's own account; CLAUDE_CODE_OAUTH_TOKEN is the same
          # credential the ladder ends on, so the fallback costs nothing but order.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags origin "+refs/heads/template-sync:refs/remotes/origin/template-sync"
          git checkout -B template-sync origin/template-sync
          bash .github/scripts/template-sync-resolve.sh

      - name: Push the resolutions
        if: steps.resolve.outcome == 'success' && (steps.resolve.outputs.deterministic != '' || steps.resolve.outputs.by_model != '')
        env:
          # token-fallback-ok: designed graceful degradation, not an accident.
          GITHUB_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.GITHUB_TOKEN }}
          DETERMINISTIC: ${{ steps.resolve.outputs.deterministic }}
          BY_MODEL: ${{ steps.resolve.outputs.by_model }}
        run: bash .github/scripts/template-sync-push.sh

      # A sync merges itself only when NOTHING needed judgement. See the script
      # for the full predicate; the two carve-outs are that a model-resolved file
      # never qualifies, and neither does a change to the supervision surface.
      - name: Enable auto-merge on a fully deterministic sync
        if: inputs.dry-run != true && steps.create-pr.outputs.pull-request-number && vars.TEMPLATE_SYNC_AUTOMERGE != 'false'
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          HAS_CONFLICTS: ${{ steps.sync.outputs.has_conflicts }}
          HAS_DELETIONS: ${{ steps.sync.outputs.has_deletions }}
          HAS_DOWNGRADES: ${{ steps.sync.outputs.has_downgrades }}
          ALL_DETERMINISTIC: ${{ steps.resolve.outputs.all_deterministic }}
          CHANGED_PATHS: ${{ steps.sync.outputs.changed_paths }}
        run: bash .github/scripts/template-sync-automerge.sh
