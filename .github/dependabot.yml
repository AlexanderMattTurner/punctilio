version: 2
updates:
  # Security updates only: version updates come from Renovate's single grouped
  # weekly PR (.github/renovate.json5), so they are capped at 0 open PRs here.
  # Security updates ignore this limit and are still raised.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    # Cooldown never actually gates anything here (open-pull-requests-limit is
    # 0), but zizmor's dependabot-cooldown audit fails absent a cooldown block.
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
